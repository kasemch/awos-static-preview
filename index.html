<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA FP-17 Auth Fix</title></head><body><p id="status">NEXA FP-17 authenticated preview</p><script type="module">

const NEXA_DATA_API_URL="https://ep-blue-leaf-b34hv87k.apirest.c-4.ap-southeast-1.aws.neon.tech/neondb/rest/v1";
