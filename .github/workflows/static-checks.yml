name: Static Preview Checks
on:
  push:
    branches: [main, feature/awos-fp-01]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic static preview
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const h=fs.readFileSync('index.html','utf8');
          for(const s of ['lang="th"','name="viewport"','aria-label="AWOS modules"','id="capture"','role="status"','id="workspace"','Private by default','prefers-reduced-motion','focus-visible','max-width:900px']) assert.ok(h.includes(s),'Missing '+s);
          const modules=['Dashboard','My Tasks','Projects','Calendar','Documents & Evidence','AI Assistant','Reports & Analytics','Approval','Settings & Profile','All-in-One Workspace'];
          for(const name of modules) assert.ok(h.includes('["'+name+'",'),'Missing module '+name);
          if(process.env.GITHUB_REF==='refs/heads/main') assert.doesNotMatch(h,/https?:\\/\\/|fetch\\s*\\(|XMLHttpRequest|localStorage|sessionStorage|service_role|supabase\\.co/i);
          else {
            assert.ok(h.includes('ep-blue-leaf-b34hv87k.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth'),'FP-11 sandbox auth endpoint missing');
            assert.doesNotMatch(h,/service_role|supabase\\.co|client_secret|DATABASE_URL/i);
            const urls=[...h.matchAll(/https?:\\/\\/[^"'\\s<]+/g)].map(m=>m[0]);
            assert.ok(urls.every(u=>u.startsWith('https://ep-blue-leaf-b34hv87k.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth')),'Unexpected external endpoint');
          }
          assert.ok(!fs.existsSync('CNAME'),'Custom domain must not be configured');
          console.log('PASS: structure, ten modules, and environment-specific network boundary. Browser/device testing remains manual.');
          NODE
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Chromium responsive and interaction acceptance
        run: node tests/browser-smoke.cjs
      - name: Upload isolated artifact (not Pages)
        uses: actions/upload-artifact@v4
        with:
          name: awos-static-preview
          path: |
            index.html
            README.md
          if-no-files-found: error
