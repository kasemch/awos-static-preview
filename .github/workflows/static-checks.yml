name: Static Preview Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public gateway and private prototype boundary
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const pub=fs.readFileSync('index.html','utf8');
          const cmd=fs.readFileSync('command-center/index.html','utf8');
          for(const s of ['name="viewport"','Kasem Chooratna','Academic Gateway','prefers-reduced-motion']) assert.ok(pub.includes(s),'Public gateway missing '+s);
          for(const s of ['name="viewport"','noindex,nofollow','KASEM Academic Command Center','NON-PRODUCTION PROTOTYPE','No private cloud data connected','Privacy Gate']) assert.ok(cmd.includes(s),'Command Center missing '+s);
          assert.doesNotMatch(cmd,/fetch\s*\(|XMLHttpRequest|localStorage|sessionStorage|service_role|supabase\.co/i);
          assert.ok(!fs.existsSync('CNAME'),'Custom domain must not be configured');
          console.log('PASS: public gateway and command-center privacy boundary.');
          NODE
      - name: Run workflow and teaching engine tests
        run: npm test
      - name: Upload isolated artifact (not Pages)
        uses: actions/upload-artifact@v4
        with:
          name: academic-command-center-preview
          path: |
            index.html
            command-center/index.html
            docs/command-center-architecture.md
            data/teaching-baseline.example.json
          if-no-files-found: error
